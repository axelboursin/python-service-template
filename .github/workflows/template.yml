name: Template

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly: catches upstream breakage (nixpkgs rolling, new tool releases)

permissions:
  contents: read

jobs:
  render-tests:
    name: Render & check generated projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # copier reads template versions from git tags
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check && uv run ruff format --check
      - run: uv run pytest -v

  devenv:
    name: devenv test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimal
            data: --data include_docker=false --data include_terraform=false
          - name: full
            data: --data include_docker=true --data include_terraform=true --data python_version=3.13
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: template
      - uses: astral-sh/setup-uv@v6
      - name: Generate project
        run: |
          uvx copier copy --trust --defaults --vcs-ref=HEAD \
            --data project_name="CI Project" ${{ matrix.data }} template generated
          cd generated && git init -q && git add -A
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - name: Run the generated project's CI command in its own environment
        working-directory: generated
        run: devenv test
